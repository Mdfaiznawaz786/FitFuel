name: Verify FitFuel

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NestJSBackend/diet-chart-generator/package-lock.json
      - run: npm ci
        working-directory: NestJSBackend/diet-chart-generator
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: NestJSBackend/diet-chart-generator
      - run: npm run build
        working-directory: NestJSBackend/diet-chart-generator
      - run: npm test -- --runInBand
        working-directory: NestJSBackend/diet-chart-generator

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend
